name: 投資データ更新

on:
  schedule:
    # 毎日 22:30 UTC = 日本時間 翌朝 7:30
    # （米国市場の引け後・日本市場が開く前のタイミング）
    - cron: "30 22 * * 1-5"
  workflow_dispatch:        # 手動でも「Run workflow」から実行できる

permissions:
  contents: write           # data/toushi.json をコミットするために必要

concurrency:
  group: toushi-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なライブラリを入れる
        run: pip install --quiet requests openpyxl xlrd

      - name: 読み取り処理の自己テスト（ネットにはつながない）
        run: python scripts/test_parsers.py

      - name: データを収集する
        timeout-minutes: 25
        run: python scripts/collect_toushi.py

      - name: 変更があればコミットする
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/toushi.json; then
            echo "変更なし。コミットしません。"
          else
            git add data/toushi.json
            git commit -m "投資データ更新 $(date -u '+%Y-%m-%d')"
            git push
          fi
