<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>投資ボード</title>
<style>
/* ===== 色の定義（ダークモードは下でまとめて差し替える） ===== */
:root{
  --bg:#ffffff; --card:#f6f7f9; --fg:#16181d; --muted:#6b7280;
  --line:#e3e6ea; --accent:#2563eb;
  --hot:#d92626; --warm:#e07a1f; --mid:#8b8f96; --cool:#0e8fa8; --cold:#2563eb;
  --up:#c62828; --down:#1565c0;   /* 日本式：上げ=赤 下げ=青 */
  --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131417; --card:#1d1f24; --fg:#e9eaec; --muted:#9aa0aa;
    --line:#31343b; --accent:#6ea8fe;
    --hot:#ff6b6b; --warm:#ffa657; --mid:#9aa0aa; --cool:#4dd0e1; --cold:#6ea8fe;
    --up:#ff7b72; --down:#79b8ff;
    --on-accent:#0b1220;
    --shadow:none;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",
       "Noto Sans JP","Yu Gothic UI",sans-serif;
  padding:0 0 72px; overflow-x:hidden;
}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* ===== ヘッダー ===== */
header{
  position:sticky; top:0; z-index:10; background:var(--bg);
  border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);
}
.hbar{display:flex;align-items:center;gap:10px;padding:10px 0;max-width:720px;margin:0 auto;padding-left:14px;padding-right:14px}

/* ===== タブ（ヘッダーと一緒に上に貼り付く） ===== */
.tabs{
  display:flex; gap:2px; max-width:720px; margin:0 auto;
  padding:0 10px 8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto; min-width:60px; min-height:44px; padding:0 12px;
  border:0; background:transparent; color:var(--muted);
  font:600 15px/1 inherit; border-radius:10px; cursor:pointer; white-space:nowrap;
}
.tab[aria-selected="true"]{
  background:var(--card); color:var(--fg); box-shadow:inset 0 0 0 1px var(--line);
}
.tab:active{opacity:.6}
.panel{display:none}
.panel.on{display:block}
.panel > section:first-child{margin-top:16px}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.stamp{font-size:12px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.3}
.iconbtn{
  min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--card);
  color:var(--fg);border-radius:10px;font-size:18px;cursor:pointer;
}
.iconbtn:active{opacity:.6}

/* ===== 総合サマリー ===== */
.summary{
  margin:14px 0; padding:14px; border-radius:14px;
  background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
}
.summary h2{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.05em}
.verdict{font-size:19px;font-weight:700;line-height:1.4}
.verdict .n{font-variant-numeric:tabular-nums}
.summary p{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.6}

/* ===== セクション ===== */
section{margin:22px 0 0}
section > h2{
  font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.06em;
  margin:0 0 8px; display:flex; align-items:baseline; gap:8px;
}
section > h2 span{font-size:11px;font-weight:400;letter-spacing:0}

/* ===== カード ===== */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  margin-bottom:10px; overflow:hidden; box-shadow:var(--shadow);
}
.head{
  display:grid; grid-template-columns:1fr auto; gap:4px 10px;
  align-items:center; padding:12px 14px; min-height:44px; cursor:pointer;
}
.head:active{background:rgba(128,128,128,.08)}
.name{font-size:14px;color:var(--muted);grid-column:1;grid-row:1}
.badge{
  grid-column:2;grid-row:1; justify-self:end;
  font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;
  border:1px solid currentColor; white-space:nowrap;
}
.val{
  grid-column:1;grid-row:2; font-size:26px;font-weight:700;
  font-variant-numeric:tabular-nums; letter-spacing:-.01em;
}
.val .u{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.chg{
  grid-column:2;grid-row:2; justify-self:end; font-size:14px;
  font-variant-numeric:tabular-nums; font-weight:600;
}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--muted)}

/* ===== 20年レンジの位置バー ===== */
.range{padding:0 14px 12px}
.track{
  position:relative; height:8px; border-radius:999px; overflow:visible;
  background:linear-gradient(90deg,var(--cold),var(--cool),var(--mid),var(--warm),var(--hot));
}
.track.rev{background:linear-gradient(90deg,var(--hot),var(--warm),var(--mid),var(--cool),var(--cold))}
.track.flat{background:var(--line)}
.pin{
  position:absolute; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px;
  border-radius:50%; background:var(--bg); border:3px solid var(--fg);
}
.ends{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}
.ends i{font-style:normal;opacity:.75;margin-left:4px;font-size:11px}
/* バーの上の「下から何%」と、どの期間での話か */
.where{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  margin-bottom:7px;font-size:12px;color:var(--muted)}
.where b{font-size:14px;color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
/* 判定を出さない理由など、小さな注記 */
.why{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.chg small{display:block;font-size:10px;font-weight:500;color:var(--muted);text-align:right;margin-top:1px}

/* ===== 期間の切り替え ===== */
.periods{display:flex;gap:6px;margin:14px 0 0;overflow-x:auto;scrollbar-width:none}
.periods::-webkit-scrollbar{display:none}
.per{
  flex:1 0 auto; min-height:44px; min-width:52px; padding:0 10px;
  border:1px solid var(--line); background:var(--card); color:var(--muted);
  border-radius:999px; font:600 14px/1 inherit; cursor:pointer; white-space:nowrap;
}
.per[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.per:active{opacity:.6}
.ends .mid{font-weight:600;color:var(--fg)}
/* 展開できることを示す小さな印 */
.caret{grid-column:2;grid-row:1;justify-self:end;color:var(--muted);font-size:12px;transition:transform .15s}
.card.open .caret{transform:rotate(180deg)}

/* ===== 展開部（チャート） ===== */
.detail{display:none;padding:0 14px 14px;border-top:1px solid var(--line);margin-top:2px}
.card.open .detail{display:block}
.chart{width:100%;height:130px;display:block;margin-top:10px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}
.chart .ar{fill:var(--accent);opacity:.10}
.chart .dot{fill:var(--accent)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:10px}
.meta{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.meta b{color:var(--fg);font-weight:600}

/* ===== メモ ===== */
textarea{
  width:100%;min-height:120px;padding:12px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--fg);
  font:16px/1.6 inherit;resize:vertical;
}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{
  min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--fg);font-size:15px;font-weight:600;cursor:pointer;
}
.btn:active{opacity:.6}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}

/* ===== 状態表示 ===== */
.state{padding:40px 14px;text-align:center;color:var(--muted);font-size:15px;line-height:1.8}
.notes{
  margin-top:16px;padding:12px 14px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);
  font-size:12px;color:var(--muted);line-height:1.7;
}
footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);line-height:1.7}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <h1>投資ボード</h1>
    <div class="stamp" id="stamp">読み込み中…</div>
    <button class="iconbtn" id="reload" title="再読み込み" aria-label="再読み込み">⟳</button>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>

<div class="wrap" id="app">
  <div class="state">データを読み込んでいます…</div>
</div>

<script>
"use strict";

/* =========================================================================
   投資ボード
   data/toushi.json（GitHub Actions が毎朝更新）を読んで表示するだけの画面。
   ここには自分の保有情報は一切持たない。メモだけ端末内に保存する。
   ========================================================================= */

const KEY = "toushi.v1";          // localStorage のキー
var DATA = null;                  // 読み込んだデータ
var OPEN = {};                    // どのカードを開いているか

/* ---------- localStorage（壊れていても落とさない） ---------- */
function loadLocal(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {memo:"", open:{}, tab:""}; }
  catch(e){ return {memo:"", open:{}, tab:""}; }
}
function saveLocal(o){
  try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){}
}
var LOCAL = loadLocal();
OPEN = LOCAL.open || {};

/* ---------- 数値の整形 ---------- */
function fmt(v, unit){
  if(v === null || v === undefined || isNaN(v)) return "—";
  var d = 2;
  if(unit === "oz") d = 4;
  else if(Math.abs(v) >= 1000) d = 0;
  else if(Math.abs(v) >= 100) d = 1;
  return v.toLocaleString("ja-JP", {minimumFractionDigits:d, maximumFractionDigits:d});
}

var DAY = 86400000;

/* 「2026年9月」のような短い日付 */
function ym(ms){
  var d = new Date(ms);
  return d.getUTCFullYear() + "年" + (d.getUTCMonth()+1) + "月";
}
function yr(ms){ return new Date(ms).getUTCFullYear() + "年"; }

/* ---------- 表示期間 ----------
   既定は「全期間」。記録はずっと積み上げていくので、長く見たいときほど価値が出る。 */
var PERIODS = [
  {id:"1y",  t:"1年",   years:1},
  {id:"5y",  t:"5年",   years:5},
  {id:"10y", t:"10年",  years:10},
  {id:"20y", t:"20年",  years:20},
  {id:"all", t:"全期間", years:null}
];
function currentPeriod(){
  for(var i=0;i<PERIODS.length;i++) if(PERIODS[i].id === LOCAL.period) return PERIODS[i];
  return PERIODS[PERIODS.length-1];              /* 既定は全期間 */
}

/* ---------- 系列から実測点を取り出す ----------
   第2版のデータは系列ごとに {t:[20260925,...], v:[...]}。
   第1版（共通の日付軸＋前の値で埋めたもの）が来ても読めるようにしておく。 */
var CACHE = {};
function allPoints(key){
  if(CACHE[key]) return CACHE[key];
  var out = [];
  var s = DATA.series[key];
  if(DATA.version === 2){
    if(s && s.t){
      for(var i=0;i<s.t.length;i++){
        if(s.v[i] === null || s.v[i] === undefined) continue;
        var n = s.t[i], y = Math.floor(n/10000), m = Math.floor(n/100)%100, d = n%100;
        out.push({ms: Date.UTC(y, m-1, d), v: s.v[i]});
      }
    }
  }else if(s && DATA.dates){
    var prev = null;
    for(var j=0;j<s.length;j++){
      if(s[j] === null || s[j] === undefined || s[j] === prev) continue;   /* 埋めた値は飛ばす */
      var p = DATA.dates[j].split("-");
      out.push({ms: Date.UTC(+p[0], +p[1]-1, +p[2]), v: s[j]});
      prev = s[j];
    }
  }
  CACHE[key] = out;
  return out;
}

/* 選んだ期間に入る点。期間は「今日から何年さかのぼるか」 */
function windowOf(key){
  var pts = allPoints(key), per = currentPeriod();
  if(!pts.length) return {pts:[], from:null, days:0};
  var today = Date.now();
  if(per.years === null){
    return {pts:pts, from:pts[0].ms, days:(pts[pts.length-1].ms - pts[0].ms)/DAY, all:true};
  }
  var from = today - per.years * 365.25 * DAY;
  var w = [];
  for(var i=0;i<pts.length;i++) if(pts[i].ms >= from) w.push(pts[i]);
  return {pts:w, from:from, days:per.years * 365.25, all:false};
}

/* ---------- 期間内を時間的に均等に間引く ----------
   保存データは「直近は毎日・昔は月1点」なので、そのまま数えると
   最近の値ばかりが重くなる。3年以下なら週1点、それより長ければ月1点にそろえる。 */
function samples(pts, spanDays){
  var weekly = spanDays <= 3 * 366, seen = {}, keys = [];
  for(var i=0;i<pts.length;i++){
    var k;
    if(weekly){ k = Math.floor((pts[i].ms / DAY + 3) / 7); }
    else{ var d = new Date(pts[i].ms); k = d.getUTCFullYear()*12 + d.getUTCMonth(); }
    if(!(k in seen)) keys.push(k);
    seen[k] = pts[i].v;                            /* その週／月の最後の値 */
  }
  return keys.map(function(k){ return seen[k]; });
}

/* ---------- 期間の中での位置と、判定してよいかどうか ---------- */
function position(key){
  var w = windowOf(key), pts = w.pts;
  var res = {pts:pts, from:w.from, pct:null, judgeable:false, reason:"", lo:null, hi:null};
  if(!pts.length){ res.reason = "この期間の記録がありません"; return res; }

  var first = pts[0].ms, last = pts[pts.length-1].ms;
  var spanDays = (last - first) / DAY;
  var lo = pts[0], hi = pts[0];
  for(var i=0;i<pts.length;i++){
    if(pts[i].v < lo.v) lo = pts[i];
    if(pts[i].v > hi.v) hi = pts[i];
  }
  res.lo = lo; res.hi = hi; res.first = first;

  /* 「記録が短い」かどうかは、期間内ではなく系列全体で見る。
     （月1回の指標は、1年の窓の中では11ヶ月ぶんにしかならないため） */
  var all = allPoints(key);
  if((all[all.length-1].ms - all[0].ms) / DAY < 365){
    res.reason = "記録が1年に満たないため位置は出せません（" + ym(all[0].ms) + "〜）";
    return res;
  }
  var smp = samples(pts, w.all ? Math.max(spanDays, 1) : w.days);
  if(smp.length < 10){
    res.reason = "この期間の点が少なすぎて位置は出せません";
    return res;
  }
  var cur = pts[pts.length-1].v, below = 0;
  for(var j=0;j<smp.length;j++) if(smp[j] < cur) below++;
  res.pct = below / Math.max(smp.length - 1, 1) * 100;
  res.pct = Math.min(100, Math.max(0, res.pct));
  /* 選んだ期間の7割以上に記録があるときだけ、割安・割高の札を出す */
  var coverage = w.all ? 1 : spanDays / w.days;
  res.judgeable = coverage >= 0.7;
  if(!res.judgeable) res.reason = "この期間の一部（" + yr(first) + "〜）しか記録がないので、札は出しません";
  return res;
}

/* ---------- 位置を言葉と色に変える ----------
   expensiveHigh が true  : 値が高いほど割高
                   false : 値が高いほど割安（イールドスプレッド）
                   null  : 判定しない（水準を見るだけ）                    */
function judge(pos, expensiveHigh){
  if(!pos || pos.pct === null || !pos.judgeable) return null;
  if(expensiveHigh === null || expensiveHigh === undefined) return null;
  var p = expensiveHigh ? pos.pct : 100 - pos.pct;  /* 「割高度」に揃える */
  if(p >= 85) return {t:"割高",     c:"var(--hot)"};
  if(p >= 65) return {t:"やや割高", c:"var(--warm)"};
  if(p >= 35) return {t:"中立",     c:"var(--mid)"};
  if(p >= 15) return {t:"やや割安", c:"var(--cool)"};
  return           {t:"割安",     c:"var(--cold)"};
}

/* ---------- 直近の変化（1つ前の実測点との差） ---------- */
function change(key){
  var pts = allPoints(key);
  if(pts.length < 2) return null;
  var a = pts[pts.length-2], b = pts[pts.length-1];
  if(!a.v) return null;
  var gap = (b.ms - a.ms) / DAY;
  var label = gap <= 4 ? "前日比" : gap <= 10 ? "前週比" : gap <= 40 ? "前月比" : "前回比";
  return {pct:(b.v - a.v) / Math.abs(a.v) * 100, label:label};
}

/* ---------- 目盛りの位置を決める ---------- */
function ticksFor(from, to){
  var spanDays = (to - from) / DAY, out = [];
  var a = new Date(from), b = new Date(to);
  if(spanDays <= 400){
    var step = spanDays <= 120 ? 1 : 3;           /* 月ごと、または3ヶ月ごと */
    var y = a.getUTCFullYear(), m = a.getUTCMonth() + 1;
    while(true){
      if(m > 11){ y++; m -= 12; }
      var ms = Date.UTC(y, m, 1);
      if(ms > to) break;
      if(m % step === 0) out.push({ms:ms, t: m === 0 ? String(y) : (m+1) + "月"});
      m++;
    }
    return out;
  }
  var years = spanDays / 365.25;
  var steps = [1, 2, 5, 10, 20, 25, 50], st = 50;
  for(var i=0;i<steps.length;i++){ if(years / steps[i] <= 6){ st = steps[i]; break; } }
  for(var yy = Math.ceil(a.getUTCFullYear() / st) * st; yy <= b.getUTCFullYear(); yy += st){
    var ms2 = Date.UTC(yy, 0, 1);
    if(ms2 >= from && ms2 <= to) out.push({ms:ms2, t:String(yy)});
  }
  return out;
}

/* ---------- チャート（SVGを手で組み立てる） ----------
   横軸は「点の順番」ではなく「時間」で置く。
   （保存データは直近ほど細かいので、順番で置くと直近が不自然に引き伸ばされる）
   値の幅が10倍を超える正の系列は対数目盛にする（150年の株価などが平らに潰れないように）。 */
function chartSVG(pts, from){
  if(pts.length < 2) return '<div class="meta">この期間の記録がまだありません。</div>';
  var W = 300, H = 120, PADL = 4, PADR = 4, PADT = 10, PADB = 16;
  var lo = Infinity, hi = -Infinity;
  for(var i=0;i<pts.length;i++){ lo = Math.min(lo, pts[i].v); hi = Math.max(hi, pts[i].v); }
  var logScale = lo > 0 && hi / lo >= 10;
  var f = logScale ? Math.log : function(v){ return v; };
  var flo = f(lo), fhi = f(hi);
  if(fhi === flo) fhi = flo + 1;
  var x0 = Math.min(from || pts[0].ms, pts[0].ms), x1 = pts[pts.length-1].ms;
  if(x1 === x0) x1 = x0 + DAY;
  var iw = W - PADL - PADR, ih = H - PADT - PADB;
  var xs = function(ms){ return PADL + iw * (ms - x0) / (x1 - x0); };
  var ys = function(v){ return PADT + ih * (1 - (f(v) - flo) / (fhi - flo)); };

  var line = "", area = "";
  for(var j=0;j<pts.length;j++){
    var x = xs(pts[j].ms).toFixed(1), y = ys(pts[j].v).toFixed(1);
    line += (j ? "L" : "M") + x + "," + y;
    area += (j ? "L" : "M" + x + "," + (PADT + ih) + "L") + x + "," + y;
  }
  area += "L" + xs(pts[pts.length-1].ms).toFixed(1) + "," + (PADT + ih) + "Z";

  var ticks = "", tk = ticksFor(x0, x1);
  for(var k=0;k<tk.length;k++){
    var tx = xs(tk[k].ms);
    if(tx < 14 || tx > W - 14) continue;
    ticks += '<line class="gl" x1="'+tx.toFixed(1)+'" y1="'+PADT+'" x2="'+tx.toFixed(1)+'" y2="'+(PADT+ih)+'"/>'
          +  '<text x="'+tx.toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle">'+tk[k].t+'</text>';
  }
  /* 右上は最新の点が来るので、注記は左上に置く */
  var note = logScale ? '<text x="'+(PADL+2)+'" y="9" text-anchor="start">対数目盛</text>' : "";
  var lx = xs(pts[pts.length-1].ms).toFixed(1), ly = ys(pts[pts.length-1].v).toFixed(1);
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'
       + ticks + note
       + '<path class="ar" d="'+area+'"/>'
       + '<path class="ln" d="'+line+'" vector-effect="non-scaling-stroke"/>'
       + '<circle class="dot" cx="'+lx+'" cy="'+ly+'" r="2.6"/>'
       + '</svg>';
}

/* ---------- カード1枚を作る ---------- */
function cardHTML(key){
  var m = DATA.meta[key];
  var all = allPoints(key);
  if(!all.length){
    return '<div class="card"><div class="head">'
         + '<div class="name">'+m.label+'</div>'
         + '<div class="val">—<span class="u"> 取得できず</span></div>'
         + '</div></div>';
  }
  var cur = all[all.length-1].v;
  var pos = position(key);
  var jd  = judge(pos, m.expensive_high);
  var chg = change(key);
  var isOpen = !!OPEN[key];
  var per = currentPeriod();

  var h = '<div class="card'+(isOpen?" open":"")+'" data-key="'+key+'">';
  h += '<div class="head" role="button" tabindex="0">';
  h +=   '<div class="name">'+m.label+'</div>';
  if(jd) h += '<div class="badge" style="color:'+jd.c+'">'+jd.t+'</div>';
  else   h += '<div class="caret">▾</div>';
  h +=   '<div class="val">'+fmt(cur, m.unit)+'<span class="u">'+m.unit+'</span></div>';
  if(chg !== null && Math.abs(chg.pct) >= 0.005){
    h += '<div class="chg '+(chg.pct > 0 ? "up" : "down")+'">'
      +  (chg.pct>0?"+":"")+chg.pct.toFixed(2)+'%<small>'+chg.label+'</small></div>';
  }else{
    h += '<div class="chg flat">—</div>';
  }
  h += '</div>';

  /* 選んだ期間の中のどこにいるか */
  if(pos.pct !== null){
    var trackCls = (m.expensive_high === null || m.expensive_high === undefined || !pos.judgeable)
                 ? "track flat" : (m.expensive_high ? "track" : "track rev");
    var pinPos = 'calc(7px + (100% - 14px) * ' + (pos.pct/100).toFixed(4) + ')';
    var scope = per.years === null ? "全期間" : "直近" + per.t;
    h += '<div class="range">'
      +    '<div class="where"><b>下から '+Math.round(pos.pct)+'%</b>'
      +      '<span>'+scope+'（'+yr(pos.first)+'〜）</span></div>'
      +    '<div class="'+trackCls+'"><div class="pin" style="left:'+pinPos+'"></div></div>'
      +    '<div class="ends"><span>最安 '+fmt(pos.lo.v,m.unit)+'<i>'+yr(pos.lo.ms)+'</i></span>'
      +      '<span>最高 '+fmt(pos.hi.v,m.unit)+'<i>'+yr(pos.hi.ms)+'</i></span></div>'
      +    (pos.reason ? '<div class="why">'+pos.reason+'</div>' : '')
      +  '</div>';
  }else{
    h += '<div class="range"><div class="why">'+pos.reason+'</div></div>';
  }

  h += '<div class="detail">'
    +    chartSVG(pos.pts, pos.from)
    +    '<div class="meta"><b>出どころ</b> '+m.source
    +      '<br><b>記録</b> '+ym(all[0].ms)+'〜　<b>時点</b> '+(DATA.asof[key] || "不明")+'</div>'
    +  '</div>';
  h += '</div>';
  return h;
}

/* ---------- 総合サマリー ---------- */
function summaryHTML(){
  var keys = ["nikkei_per","nikkei_pbr","spx_per","cape","ys_jp","ys_us"];
  var hot = 0, cold = 0, n = 0, pending = [];
  for(var i=0;i<keys.length;i++){
    var m = DATA.meta[keys[i]];
    var jd = judge(position(keys[i]), m.expensive_high);
    if(!jd){ pending.push(m.label); continue; }
    n++;
    if(jd.t.indexOf("割高") >= 0) hot++;
    if(jd.t.indexOf("割安") >= 0) cold++;
  }
  var per = currentPeriod();
  var scope = per.years === null ? "全期間" : "直近" + per.t;
  var line, sub;
  if(n === 0){
    line = "判定はまだ出せません";
    sub  = "この期間で判定できる記録がそろっていません。";
  }else if(hot > cold){
    line = '株式は<span style="color:var(--hot)">割高より</span>　<span class="n">'+hot+'</span>/'+n+' 指標';
    sub  = scope + "で見ると、判定できた " + n + " 本のうち " + hot + " 本が上位にいます。";
  }else if(cold > hot){
    line = '株式は<span style="color:var(--cold)">割安より</span>　<span class="n">'+cold+'</span>/'+n+' 指標';
    sub  = scope + "で見ると、判定できた " + n + " 本のうち " + cold + " 本が下位にいます。";
  }else{
    line = '株式は<span style="color:var(--mid)">中立</span>　<span class="n">'+n+'</span> 指標で拮抗';
    sub  = scope + "で見ると、割高側と割安側が同数です。";
  }
  if(pending.length) sub += "<br>記録が足りず判定なし：" + pending.join("・");
  return '<div class="summary"><h2>いまの見立て</h2>'
       + '<div class="verdict">'+line+'</div><p>'+sub+'</p></div>';
}

/* ---------- 期間の切り替えボタン ---------- */
function periodsHTML(){
  var cur = currentPeriod().id, h = '<div class="periods" role="radiogroup" aria-label="表示期間">';
  for(var i=0;i<PERIODS.length;i++){
    h += '<button class="per" role="radio" data-per="'+PERIODS[i].id+'" aria-checked="'
      +  (PERIODS[i].id === cur) + '">'+PERIODS[i].t+'</button>';
  }
  return h + '</div>';
}

/* ---------- タブの構成 ----------
   縦に長すぎて探せなくなるので、用途ごとに画面を分ける。
   groups は各タブに入れる中身の種類。                                     */
var TABS = [
  {id:"judge", t:"判定", groups:[
      {g:"value",  t:"割安 / 割高", note:"過去の分布の中での位置"},
      {g:"spread", t:"株 vs 債券",  note:"高いほど株が有利"}]},
  {id:"rate",  t:"金利", groups:[{g:"rate",  t:"金利とインフレ", note:""}]},
  {id:"ratio", t:"比率", groups:[
      {g:"ratio", t:"比率",     note:""},
      {g:"fx",    t:"通貨換算", note:"その日の為替で換算"}]},
  {id:"price", t:"価格", groups:[{g:"price", t:"価格",          note:""}]},
  {id:"memo",  t:"メモ", groups:[]}
];

function currentTab(){
  for(var i=0;i<TABS.length;i++) if(TABS[i].id === LOCAL.tab) return LOCAL.tab;
  return TABS[0].id;                       /* 保存値が古い・壊れていたら先頭 */
}

function showTab(id){
  LOCAL.tab = id; saveLocal(LOCAL);
  var panels = document.querySelectorAll(".panel");
  for(var i=0;i<panels.length;i++){
    panels[i].classList.toggle("on", panels[i].getAttribute("data-panel") === id);
  }
  var btns = document.querySelectorAll(".tab");
  for(var j=0;j<btns.length;j++){
    btns[j].setAttribute("aria-selected",
      btns[j].getAttribute("data-tab") === id ? "true" : "false");
  }
  window.scrollTo(0, 0);                   /* 切り替えたら先頭から見せる */
}

/* ---------- 画面全体を組み立てる ---------- */
function render(){
  var active = currentTab();

  /* タブの見出し（ヘッダーの中に置くので、スクロールしても消えない） */
  var tabs = "";
  for(var t=0;t<TABS.length;t++){
    tabs += '<button class="tab" role="tab" data-tab="'+TABS[t].id+'"'
         +  ' aria-selected="'+(TABS[t].id===active)+'">'+TABS[t].t+'</button>';
  }
  document.getElementById("tabs").innerHTML = tabs;

  /* 期間の切り替えは、メモ以外のすべてのタブに効くので一番上に置く */
  var h = periodsHTML() + summaryHTML();

  for(var t2=0;t2<TABS.length;t2++){
    var tab = TABS[t2];
    h += '<div class="panel'+(tab.id===active?" on":"")+'" data-panel="'+tab.id+'">';
    for(var i=0;i<tab.groups.length;i++){
      var body = "";
      for(var key in DATA.meta){
        if(DATA.meta[key].group === tab.groups[i].g) body += cardHTML(key);
      }
      if(!body) continue;
      h += '<section><h2>'+tab.groups[i].t
        +  (tab.groups[i].note ? '<span>'+tab.groups[i].note+'</span>' : '')
        +  '</h2>'+body+'</section>';
    }

    if(tab.id === "memo"){
      /* メモ（端末内にだけ保存される） */
      h += '<section><h2>メモ<span>この端末の中だけに保存されます</span></h2>'
        +  '<textarea id="memo" placeholder="気づいたこと、次に確認すること…"></textarea>'
        +  '<div class="row">'
        +    '<button class="btn" id="exp">書き出す</button>'
        +    '<button class="btn" id="imp">読み込む</button>'
        +  '</div></section>';
      /* 収集時に気になった点があれば出す */
      if(DATA.notes && DATA.notes.length){
        h += '<div class="notes"><b>データ収集のメモ</b><br>' + DATA.notes.join("<br>") + '</div>';
      }
    }
    h += '</div>';
  }

  h += '<footer>公開情報をまとめて眺めるための道具です。投資判断そのものは自分で行ってください。'
    +  '保有数量や資産額はこのページには一切含まれていません。</footer>';

  document.getElementById("app").innerHTML = h;

  /* タブの切り替え */
  var btns = document.querySelectorAll(".tab");
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener("click", function(){
      showTab(this.getAttribute("data-tab"));
    });
  }

  /* 期間の切り替え（選んだ期間は覚えておく。画面の位置は保ったまま描き直す） */
  var pers = document.querySelectorAll(".per");
  for(var q=0;q<pers.length;q++){
    pers[q].addEventListener("click", function(){
      var id = this.getAttribute("data-per");
      if(id === currentPeriod().id) return;
      LOCAL.period = id; saveLocal(LOCAL);
      var y = window.scrollY;
      render();
      window.scrollTo(0, y);
    });
  }

  /* メモの復元と自動保存 */
  var memo = document.getElementById("memo");
  memo.value = LOCAL.memo || "";
  memo.addEventListener("input", function(){
    LOCAL.memo = memo.value; saveLocal(LOCAL);
  });
  document.getElementById("exp").onclick = exportJSON;
  document.getElementById("imp").onclick = importJSON;

  /* カードの開閉 */
  var heads = document.querySelectorAll(".head");
  for(var k=0;k<heads.length;k++){
    heads[k].addEventListener("click", function(){
      var card = this.closest(".card");
      var key = card.getAttribute("data-key");
      card.classList.toggle("open");
      OPEN[key] = card.classList.contains("open");
      LOCAL.open = OPEN; saveLocal(LOCAL);
    });
  }
}

/* ---------- メモの書き出し / 読み込み ---------- */
function exportJSON(){
  try{
    var blob = new Blob([JSON.stringify(LOCAL, null, 2)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "toushi-memo-" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  }catch(e){ alert("書き出せませんでした"); }
}
function importJSON(){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json";
  inp.onchange = function(){
    var f = inp.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var o = JSON.parse(r.result);
        LOCAL.memo = o.memo || ""; saveLocal(LOCAL);
        document.getElementById("memo").value = LOCAL.memo;
      }catch(e){ alert("読み込めないファイルでした"); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ---------- データの読み込み ---------- */
function load(){
  document.getElementById("stamp").textContent = "読み込み中…";
  fetch("./data/toushi.json?t=" + Date.now())
    .then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(json){
      DATA = json;
      CACHE = {};                                  /* 前回読んだ点を捨てる */
      /* いちばん新しい実測日（第1版は共通の日付軸の末尾） */
      var latest = "";
      if(json.dates){ latest = json.dates[json.dates.length-1]; }
      else{ for(var k in json.asof){ if(json.asof[k] && json.asof[k] > latest) latest = json.asof[k]; } }
      var d = new Date(json.updated);
      document.getElementById("stamp").innerHTML =
        "更新 " + d.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})
        + "<br>" + latest + " 時点";
      render();
    })
    .catch(function(e){
      document.getElementById("stamp").textContent = "読み込み失敗";
      document.getElementById("app").innerHTML =
        '<div class="state">データを読み込めませんでした。<br>'
        + '通信を確認して、右上の ⟳ を押してください。<br><br>'
        + '<span style="font-size:13px">(' + e.message + ')</span></div>';
    });
}

document.getElementById("reload").onclick = load;
load();
</script>
