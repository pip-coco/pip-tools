<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>こんだて表</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">

<style>
  /* ===== 色（買い物リストアプリと同じ配色で揃えています） ===== */
  :root{
    --bg:#EFEEF2;
    --surface:#FFFFFF;
    --surface-2:#F6F4F8;
    --fg:#221E26;
    --muted:#6B6473;
    --line:#E1DDE6;
    --line-strong:#C9C2D0;
    --accent:#6E2E63;
    --accent-soft:#F3E9F1;
    --done:#456F37;
    --today:#B4732A;
    --shadow:0 1px 2px rgba(34,24,38,.05), 0 12px 28px -18px rgba(34,24,38,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15121A; --surface:#1F1B25; --surface-2:#282231;
      --fg:#ECE7F0; --muted:#A099A9; --line:#332C3B; --line-strong:#4A4155;
      --accent:#DA9ECC; --accent-soft:#2B2130; --done:#8CBE72; --today:#E0AC6A;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15121A; --surface:#1F1B25; --surface-2:#282231;
    --fg:#ECE7F0; --muted:#A099A9; --line:#332C3B; --line-strong:#4A4155;
    --accent:#DA9ECC; --accent-soft:#2B2130; --done:#8CBE72; --today:#E0AC6A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .app{
    position:relative;
    display:flex;
    flex-direction:column;
    height:100dvh;
    max-width:480px;
    margin:0 auto;
    background:var(--surface);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }
  @media (max-width:520px){ .app{border-left:0;border-right:0;} }

  /* ===== タブ ===== */
  .tabs{
    flex:none;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .tabs button{
    appearance:none;
    border:0;
    border-bottom:2.5px solid transparent;
    background:transparent;
    color:var(--muted);
    font-family:"Zen Maru Gothic","Zen Kaku Gothic New",sans-serif;
    font-size:.98rem;
    font-weight:700;
    letter-spacing:.05em;
    padding:15px 4px 13px;
    min-height:50px;
    cursor:pointer;
  }
  .tabs button[aria-selected="true"]{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }
  .tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;}

  /* 4つめ（常備品）は矢印で出し入れする */
  #mainTabs{grid-template-columns:1fr 1fr 1fr 46px;}
  .tabnext{font-size:1.35rem;padding:0;}
  .tabnext:hover{color:var(--accent);background:var(--surface-2);}
  .pantrybar{display:flex;align-items:center;gap:2px;padding:0;}
  .pantrybar .tabback{
    flex:none;width:52px;min-height:50px;
    border:0;border-bottom:2.5px solid transparent;
    background:transparent;color:var(--accent);
    font-size:1.4rem;line-height:1;padding:0;cursor:pointer;
  }
  .pantrybar .tabback:hover{background:var(--surface-2);}
  .pantrytitle{
    font-family:"Zen Maru Gothic","Zen Kaku Gothic New",sans-serif;
    font-weight:700;font-size:.98rem;letter-spacing:.06em;
    color:var(--accent);
  }

  /* 常備品の画面 */
  .panetools{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 16px;border-bottom:1px solid var(--line);
  }
  .pantryinfo{font-size:.88rem;color:var(--muted);}
  /* 常備品の編集行（2段組み） */
  .pedit{
    display:flex;flex-direction:column;gap:6px;
    padding:10px 0 12px;border-bottom:1px solid var(--line);
  }
  .pedit .r1{display:grid;grid-template-columns:1fr 40px;gap:6px;align-items:center;}
  .pedit .r2{display:grid;grid-template-columns:1fr 58px 52px;gap:6px;align-items:center;}
  .pedit input,.pedit select{
    font:inherit;font-size:.92rem;height:42px;min-width:0;
    padding:0 9px;
    border:1px solid var(--line-strong);border-radius:5px;
    background:var(--surface);color:var(--fg);
  }
  .pedit select{padding-right:4px;}
  .pedit input:focus,.pedit select:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .pedit input[type="number"]{text-align:right;font-family:"IBM Plex Mono",monospace;}
  .pedit .del{
    height:42px;border:0;border-radius:5px;
    background:transparent;color:var(--line-strong);
    font-size:.9rem;cursor:pointer;
  }
  .pedit .del:hover{color:var(--fg);background:var(--line);}
  .pedit .del:focus-visible{outline:2px solid var(--accent);}
  .pantryinfo.warn{color:var(--accent);font-weight:700;}
  .statepill{
    flex:none;margin-right:14px;
    min-height:31px;display:inline-flex;align-items:center;
    padding:0 14px;border-radius:16px;
    border:1px solid var(--line-strong);
    color:var(--muted);font-size:.82rem;white-space:nowrap;
  }
  .row.isout .statepill{
    border-color:var(--accent);background:var(--accent);
    color:var(--surface);font-weight:700;
  }
  .row.isout .rowname{color:var(--accent);font-weight:700;}

  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .pane{padding:0 0 28px;}

  /* ===== 週の切り替え ===== */
  .weekbar{
    position:sticky;
    top:0;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:11px 8px;
    background:var(--surface-2);
    border-bottom:1px solid var(--line);
  }
  .weekbar button{
    flex:none;
    width:44px;height:44px;
    border:0;border-radius:50%;
    background:transparent;color:var(--muted);
    font-size:1.1rem;cursor:pointer;
  }
  .weekbar button:hover{background:var(--surface);color:var(--fg);}
  .weekbar button:focus-visible{outline:2px solid var(--accent);}
  .weeklabel{
    flex:1;
    text-align:center;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.95rem;
    font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
  }
  .weeklabel .sub{
    display:block;
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-size:.72rem;
    letter-spacing:.1em;
    color:var(--muted);
    margin-top:-2px;
  }

  /* ===== 献立表 ===== */
  .day{
    display:grid;
    grid-template-columns:58px 1fr;
    gap:0 12px;
    padding:13px 16px 13px 12px;
    border-bottom:1px solid var(--line);
  }
  .day.is-today{background:var(--accent-soft);}
  .daylabel{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:5px;
    gap:1px;
  }
  .daylabel .wd{
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:.95rem;
    font-weight:700;
  }
  .daylabel .dt{
    font-family:"IBM Plex Mono",monospace;
    font-size:.75rem;
    font-variant-numeric:tabular-nums;
    color:var(--muted);
  }
  .day.sat .wd{color:#3E6FA8;}
  .day.sun .wd{color:#A8484A;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .day.sat .wd{color:#8FB6E0;}
    :root:not([data-theme="light"]) .day.sun .wd{color:#E39194;}
  }
  :root[data-theme="dark"] .day.sat .wd{color:#8FB6E0;}
  :root[data-theme="dark"] .day.sun .wd{color:#E39194;}
  .day.is-today .daylabel .dt{color:var(--today);font-weight:700;}

  .dishes{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    align-items:flex-start;
    min-height:40px;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:2px;
    background:var(--surface-2);
    border:1px solid var(--line-strong);
    border-radius:16px;
    padding:0 4px 0 12px;
    font-size:.9rem;
    max-width:100%;
  }
  .chip .cn{padding:6px 0;word-break:break-word;}
  .chip .cx{
    flex:none;
    width:30px;height:30px;
    border:0;background:transparent;
    color:var(--muted);
    font-size:.8rem;
    cursor:pointer;border-radius:50%;
  }
  .chip .cx:hover{color:var(--fg);background:var(--line);}
  .chip .cx:focus-visible{outline:2px solid var(--accent);}

  .addchip{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:40px;height:40px;
    padding:0 12px;
    border:1.5px dashed var(--line-strong);
    border-radius:16px;
    background:transparent;
    color:var(--muted);
    font-size:1rem;
    cursor:pointer;
  }
  .addchip:hover{border-color:var(--accent);color:var(--accent);}
  .addchip:focus-visible{outline:2px solid var(--accent);}

  /* ===== 買い物リスト ===== */
  .seclabel{
    margin:0;
    padding:20px 18px 7px;
    font-family:"Zen Maru Gothic","Zen Kaku Gothic New",sans-serif;
    font-size:.78rem;
    font-weight:500;
    letter-spacing:.14em;
    color:var(--muted);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .seclabel .n{
    font-family:"IBM Plex Mono",monospace;
    font-variant-numeric:tabular-nums;
    letter-spacing:0;
  }

  .row{
    display:flex;
    align-items:stretch;
    border-bottom:1px solid var(--line);
  }
  .rowtick{
    flex:1;
    display:flex;
    align-items:center;
    gap:12px;
    min-height:54px;
    padding:7px 4px 7px 18px;
    border:0;background:transparent;color:var(--fg);
    font:inherit;text-align:left;cursor:pointer;
  }
  .rowtick:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;}
  .box{
    flex:none;width:22px;height:22px;
    border:2px solid var(--line-strong);
    border-radius:50%;
    display:grid;place-content:center;
  }
  .box::after{
    content:"";width:9px;height:5px;
    border-left:2.5px solid var(--surface);
    border-bottom:2.5px solid var(--surface);
    transform:rotate(-45deg) scale(0);
    transition:transform .14s ease;
  }
  .rowmain{flex:1;min-width:0;}
  .rowname{
    display:flex;align-items:baseline;gap:8px;
    line-height:1.4;flex-wrap:wrap;
  }
  .rowname .qty{
    font-family:"IBM Plex Mono",monospace;
    font-size:.88rem;
    font-variant-numeric:tabular-nums;
    color:var(--accent);
    white-space:nowrap;
  }
  .rowfrom{
    font-size:.74rem;
    color:var(--muted);
    line-height:1.5;
    margin-top:1px;
  }
  .row.checked .box{border-color:var(--done);background:var(--done);}
  .row.checked .box::after{transform:rotate(-45deg) scale(1);}
  .row.checked .rowname{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong);}
  .row.checked .qty{color:var(--muted);}
  /* ===== 数量ボタン（押せることが分かる見た目にする） ===== */
  .qtybtn{
    flex:none;align-self:center;
    display:inline-flex;align-items:center;gap:5px;
    min-height:34px;padding:0 12px;
    border:1px solid var(--accent);border-radius:17px;
    background:var(--accent-soft);color:var(--accent);
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.84rem;font-variant-numeric:tabular-nums;
    cursor:pointer;white-space:nowrap;
  }
  .qtybtn .pm{font-size:.76rem;opacity:.5;}
  .qtybtn:hover{background:var(--accent);color:var(--surface);}
  .qtybtn:hover .pm{opacity:.85;}
  .qtybtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .row.checked .qtybtn{
    border-color:var(--line);background:transparent;color:var(--muted);
  }
  .row.checked .qtybtn .pm{opacity:.35;}
  .qtyfree{
    flex:none;align-self:center;
    font-size:.8rem;color:var(--muted);
    padding:0 14px;white-space:nowrap;
  }
  /* 途中まで買った印：まるが半分だけ塗られる */
  .row.partial .box{
    border-color:var(--done);
    background:linear-gradient(90deg, var(--done) 0 50%, transparent 50% 100%);
  }

  /* 数量入力パネル */
  .qtyblock{padding:8px 18px 22px;display:flex;flex-direction:column;gap:13px;}
  .qtytotal{margin:0;font-size:.86rem;color:var(--muted);text-align:center;}
  .stepper{display:flex;align-items:center;justify-content:center;gap:13px;}
  .stepper button{
    flex:none;width:62px;height:60px;border-radius:12px;
    border:1.5px solid var(--line-strong);
    background:var(--surface);color:var(--fg);
    font-family:"IBM Plex Mono",monospace;font-size:1.15rem;line-height:1;cursor:pointer;
  }
  .stepper button:hover{border-color:var(--accent);color:var(--accent);}
  .stepper button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .stepper input{
    width:104px;height:60px;min-width:0;
    text-align:center;
    font-family:"IBM Plex Mono",monospace;font-size:1.4rem;font-variant-numeric:tabular-nums;
    border:1.5px solid var(--line-strong);border-radius:10px;
    background:var(--surface);color:var(--fg);
  }
  .stepper input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
  .qtyrest{
    margin:0;text-align:center;
    font-family:"Zen Maru Gothic","Zen Kaku Gothic New",sans-serif;
    font-size:1.08rem;font-weight:700;color:var(--accent);
  }
  .qtyacts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

  /* 今週はずしたもの */
  .row.hiddenrow{
    background:var(--surface-2);
    align-items:center;
    padding:8px 12px 8px 18px;
    gap:10px;
  }
  .hiddenmain{flex:1;min-width:0;opacity:.62;}
  .restore{
    flex:none;
    min-height:40px;padding:0 15px;
    border:1px solid var(--line-strong);border-radius:20px;
    background:var(--surface);color:var(--fg);
    font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap;
  }
  .restore:hover{border-color:var(--accent);color:var(--accent);}
  .restore:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .restoreall{
    border:0;background:transparent;
    color:var(--accent);font:inherit;font-size:.78rem;
    letter-spacing:.04em;text-decoration:underline;text-underline-offset:3px;
    padding:4px 2px;cursor:pointer;
  }
  .restoreall:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .rowx{
    flex:none;width:48px;
    border:0;background:transparent;color:var(--line-strong);
    font-size:.95rem;cursor:pointer;
  }
  .rowx:hover{color:var(--fg);}
  .rowx:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;}

  /* ===== レシピ ===== */
  .dishrow{
    display:flex;align-items:stretch;
    border-bottom:1px solid var(--line);
  }
  .dishrow > button.open{
    flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;
    min-height:54px;padding:9px 16px;
    border:0;background:transparent;color:var(--fg);
    font:inherit;text-align:left;cursor:pointer;
  }
  .dishrow > button.open:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;}
  .dishrow .cnt{
    font-size:.78rem;color:var(--muted);
    font-family:"IBM Plex Mono",monospace;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .editor{
    padding:6px 16px 20px;
    border-bottom:1px solid var(--line);
    background:var(--surface-2);
    display:flex;flex-direction:column;gap:10px;
  }
  .ingrow{
    display:grid;
    grid-template-columns:1fr 58px 52px 40px;
    gap:6px;
    align-items:center;
  }
  .ingrow input{
    font:inherit;font-size:.92rem;
    height:42px;min-width:0;
    padding:0 9px;
    border:1px solid var(--line-strong);
    border-radius:5px;
    background:var(--surface);color:var(--fg);
  }
  .ingrow input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .ingrow input[type="number"]{text-align:right;font-family:"IBM Plex Mono",monospace;}
  .ingrow .del{
    height:42px;border:0;border-radius:5px;
    background:transparent;color:var(--line-strong);
    font-size:.9rem;cursor:pointer;
  }
  .ingrow .del:hover{color:var(--fg);background:var(--line);}
  .inghead{
    display:grid;
    grid-template-columns:1fr 58px 52px 40px;
    gap:6px;
    font-size:.7rem;color:var(--muted);letter-spacing:.08em;
    padding:2px 2px 0;
  }
  .inghead span:nth-child(2),.inghead span:nth-child(3){text-align:center;}

  .ghost{
    align-self:flex-start;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--fg);
    font:inherit;font-size:.88rem;
    border-radius:6px;
    padding:9px 15px;min-height:42px;
    cursor:pointer;
  }
  .ghost:hover{border-color:var(--accent);color:var(--accent);}
  .ghost:focus-visible{outline:2px solid var(--accent);}
  .ghost.danger:hover{border-color:#A8484A;color:#A8484A;}

  .editrow{display:flex;gap:8px;flex-wrap:wrap;}
  .namefield{
    width:100%;font:inherit;font-size:1rem;font-weight:700;
    height:46px;padding:0 12px;
    border:1px solid var(--line-strong);border-radius:6px;
    background:var(--surface);color:var(--fg);
  }
  .namefield:focus{outline:2px solid var(--accent);outline-offset:-1px;}

  /* ===== ボトムシート（レシピを選ぶ） ===== */
  .sheetbg{
    position:absolute;inset:0;z-index:40;
    background:rgba(20,14,24,.42);
  }
  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:41;
    max-height:74%;
    display:flex;flex-direction:column;
    background:var(--surface);
    border-top-left-radius:14px;border-top-right-radius:14px;
    box-shadow:var(--shadow);
    animation:up .2s ease;
  }
  @keyframes up{from{transform:translateY(14px);opacity:0;}to{transform:none;opacity:1;}}
  .sheet h2{
    margin:0;padding:16px 18px 12px;
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:1.02rem;font-weight:700;
    border-bottom:1px solid var(--line);
  }
  .sheethead{
    flex:none;display:flex;align-items:stretch;
    border-bottom:1px solid var(--line);
  }
  .sheethead h2{flex:1;border-bottom:0;}
  .sheethead .back{
    flex:none;width:46px;border:0;background:transparent;
    color:var(--accent);font-size:1.4rem;line-height:1;cursor:pointer;
  }
  .sheethead .back:hover{background:var(--surface-2);}
  .sheethead .back:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;}
  /* もどるボタンが出ているときだけ、見出しの左余白を詰める */
  .sheethead .back:not([hidden]) + h2{padding-left:2px;}

  /* シート内の1行（分類 / レシピ） */
  #sheetList .srow{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  #sheetList .srow .n{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.8rem;font-variant-numeric:tabular-nums;
    color:var(--muted);white-space:nowrap;
  }
  #sheetList .srow .tag{
    font-size:.72rem;color:var(--muted);
    border:1px solid var(--line-strong);border-radius:3px;
    padding:1px 6px;white-space:nowrap;
  }

  /* ===== 分類のしぼりこみ ===== */
  /* 折り返して全部見えるようにする（横スクロールは端が切れて気づけないため） */
  .filters{
    display:flex;flex-wrap:wrap;gap:8px;
    padding:13px 16px;
    border-bottom:1px solid var(--line);
  }
  .filters button{
    flex:none;
    display:inline-flex;align-items:center;gap:6px;
    min-height:40px;padding:0 14px;
    border:1px solid var(--line-strong);border-radius:20px;
    background:var(--surface);color:var(--fg);
    font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap;
  }
  .filters button .fn{
    font-family:"IBM Plex Mono",ui-monospace,monospace;

<script>
(function(){
  "use strict";

  var KEY = 'kondate.v1';
  var WD = ['日','月','火','水','木','金','土'];
  var CATS = ['主食','主菜','副菜','汁物','デザート','その他'];
  // 常備品は「置き場所」で分ける（棚の前で確認しやすいように）
  var PCATS = ['調味料','粉・乾物','冷蔵・冷凍','缶詰・ストック','日用品','その他'];

  // ---------- 初期データ（4人分＝大人2＋子ども2 を想定。画面から直せます） ----------
  function seed(){
    return {
      dishes: [
        d('チャーハン','主食', [i('ごはん',4,'杯'), i('卵',3,'個'), i('長ねぎ',1,'本'), i('ハム',4,'枚'), i('ごま油',null,'')]),
        d('ラザニア','主菜', [i('ラザニアシート',9,'枚'), i('合いびき肉',400,'g'), i('玉ねぎ',1,'個'), i('にんじん',1,'本'), i('トマト缶',1,'缶'), i('牛乳',300,'ml'), i('バター',30,'g'), i('小麦粉',30,'g'), i('ピザ用チーズ',150,'g')]),
        d('パスタ','主食', [i('スパゲッティ',400,'g'), i('玉ねぎ',1,'個'), i('ベーコン',100,'g'), i('トマト缶',1,'缶'), i('にんにく',1,'片'), i('オリーブオイル',null,''), i('粉チーズ',null,'')]),
        d('煮浸し','副菜', [i('小松菜',2,'束'), i('油揚げ',2,'枚'), i('しょうが',1,'片'), i('めんつゆ',null,'')]),
        d('刺身の盛り合わせ','主菜', [i('刺身盛り合わせ',1,'パック'), i('大根',1,'本'), i('大葉',1,'束'), i('わさび',null,''), i('しょうゆ',null,'')]),
        d('カレー','主食', [i('カレールー',1,'箱'), i('豚こま肉',300,'g'), i('じゃがいも',3,'個'), i('にんじん',1,'本'), i('玉ねぎ',2,'個'), i('ごはん',4,'杯'), i('福神漬け',1,'袋')]),
        d('味噌汁','汁物', [i('豆腐',1,'丁'), i('長ねぎ',1,'本'), i('わかめ',null,''), i('味噌',null,''), i('だしパック',1,'個')]),
        d('フルーツ盛り合わせ','デザート', [i('りんご',1,'個'), i('みかん',4,'個'), i('いちご',1,'パック'), i('キウイ',2,'個')])
      ],
      staples: [
        i('バナナ',1,'房'), i('ヨーグルト',2,'個'), i('卵',1,'パック'), i('納豆',2,'パック')
      ],
      pantry: seedPantry(),
      settings:{ weekStartDay: 3 },   // 0=日 1=月 2=火 3=水 4=木 5=金 6=土
      plansByDate:{}, extras:{}, checked:{}, skipped:{}, bought:{}
    };
  }

  // 家に置いてある調味料・常備食材。out=true が「切らした（買う）」
  function seedPantry(){
    var C='調味料', K='粉・乾物', R='冷蔵・冷凍', S='缶詰・ストック', N='日用品';
    return [
      pt('しょうゆ',1,'本',C), pt('みりん',1,'本',C), pt('料理酒',1,'本',C),
      pt('砂糖',1,'袋',C), pt('塩',1,'袋',C), pt('こしょう',1,'個',C),
      pt('サラダ油',1,'本',C), pt('ごま油',1,'本',C), pt('オリーブオイル',1,'本',C),
      pt('酢',1,'本',C), pt('中濃ソース',1,'本',C), pt('めんつゆ',1,'本',C),
      pt('だしパック',1,'袋',C),
      pt('小麦粉',1,'袋',K), pt('片栗粉',1,'袋',K), pt('パン粉',1,'袋',K),
      pt('焼きのり',1,'袋',K),
      pt('味噌',1,'パック',R), pt('マヨネーズ',1,'本',R), pt('ケチャップ',1,'本',R),
      pt('バター',1,'個',R),
      pt('トマト缶',1,'缶',S), pt('ツナ缶',1,'缶',S), pt('カレールー',1,'箱',S),
      pt('トイレットペーパー',1,'パック',N), pt('キッチンペーパー',1,'パック',N),
      pt('ラップ',1,'本',N), pt('食器用洗剤',1,'本',N), pt('ゴミ袋',1,'袋',N)
    ];
  }
  function pt(name, qty, unit, cat){
    var o = i(name, qty, unit);
    o.out = false;
    o.cat = cat || 'その他';
    return o;
  }
  function uid(){ return Math.random().toString(36).slice(2,9); }
  function d(name, cat, ings){ return { id: uid(), name: name, cat: cat, ingredients: ings }; }

  // 分類がまだ付いていない古いデータ用の対応表
  var LEGACY_CAT = {
    'チャーハン':'主食', 'パスタ':'主食', 'カレー':'主食',
    'ラザニア':'主菜', '刺身の盛り合わせ':'主菜',
    '煮浸し':'副菜', '味噌汁':'汁物', 'フルーツ盛り合わせ':'デザート'
  };
  function i(name, qty, unit){ return { id: uid(), name: name, qty: qty, unit: unit }; }

  // ---------- 保存・読み込み ----------
  var state = load();
  var view = { tab:'shop', prevTab:'shop', week: weekStartOf(new Date()),
               openDish:null, dishFilter:'all', pantryEdit:false, pantryFilter:'all' };
  var undoSnap = null, toastTimer = null;
  var pickTarget = null, pickDate = null, pickCat = null, qtyItem = null;

  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if (raw && Array.isArray(raw.dishes)) return normalize(raw);
    }catch(e){}
    return seed();
  }

  // 古い保存形式（週ごと×曜日番号）を、日付ごとの形に移し替える。
  // こうしておくと「週のはじまり」を変えても献立が迷子にならない。
  function normalize(raw){
    raw.extras = raw.extras || {};
    raw.checked = raw.checked || {};
    raw.skipped = raw.skipped || {};
    raw.bought = raw.bought || {};
    raw.staples = raw.staples || [];
    // 常備品はあとから足した機能なので、無ければ初期セットを入れる
    if (!Array.isArray(raw.pantry)) raw.pantry = seedPantry();
    // 分類が無い常備品に分類を付ける
    var seedCat = {};
    seedPantry().forEach(function(s){ seedCat[s.name] = s.cat; });
    raw.pantry.forEach(function(p){
      if (PCATS.indexOf(p.cat) < 0) p.cat = seedCat[p.name] || 'その他';
    });
    raw.settings = raw.settings || {};
    if (typeof raw.settings.weekStartDay !== 'number') raw.settings.weekStartDay = 3;

    // 分類が無いレシピに分類を付ける
    raw.dishes.forEach(function(dish){
      if (CATS.indexOf(dish.cat) < 0) dish.cat = LEGACY_CAT[dish.name] || 'その他';
    });

    if (!raw.plansByDate){
      raw.plansByDate = {};
      var old = raw.plans || {};
      Object.keys(old).forEach(function(wk){
        Object.keys(old[wk] || {}).forEach(function(idx){
          var dk = key(addDays(wk, parseInt(idx, 10)));
          raw.plansByDate[dk] = (raw.plansByDate[dk] || []).concat(old[wk][idx] || []);
        });
      });
    }
    delete raw.plans;
    return raw;
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  function snapshot(){ undoSnap = JSON.parse(JSON.stringify(state)); }
  function undo(){
    if(!undoSnap) return;
    state = undoSnap; undoSnap = null;
    save(); render(); hideToast();
  }

  // ---------- 日付まわり（週のはじまりは設定で変えられる） ----------
  function startDay(){
    var v = state && state.settings ? state.settings.weekStartDay : 3;
    return (typeof v === 'number') ? v : 3;
  }
  function weekStartOf(date){
    var t = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    var back = (t.getDay() - startDay() + 7) % 7;
    t.setDate(t.getDate() - back);
    return key(t);
  }
  function key(dt){
    return dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate());
  }
  function pad(n){ return (n<10?'0':'') + n; }
  function fromKey(k){
    var p = k.split('-');
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function addDays(k, n){
    var dt = fromKey(k); dt.setDate(dt.getDate()+n); return dt;
  }
  function md(dt){ return (dt.getMonth()+1) + '/' + dt.getDate(); }

  // ---------- 集計 ----------
  function itemKey(name, unit){ return name + '␀' + (unit||''); }
  function fmtQty(q, unit){
    if (q === null || q === undefined) return '適量';
    var n = Math.round(q*100)/100;
    return String(n) + (unit||'');
  }

  function buildList(){
    var wk = view.week;
    var skipped = state.skipped[wk] || {};
    var map = new Map();

    // 献立の材料も毎週の定番も、同じ入れものに入れて合算する。
    // source に料理名が入っていれば献立由来、null なら定番由来。
    function push(ing, source){
      if (!ing.name || !ing.name.trim()) return;   // 名前が空の行は買い物リストに出さない
      var k = itemKey(ing.name, ing.unit);
      var cur = map.get(k);
      if (!cur) {
        cur = { key:k, name:ing.name, unit:ing.unit, qty:ing.qty,
                from:[], fromPlan:false, fromStaple:false };
        map.set(k, cur);
      } else {
        cur.qty = (cur.qty === null || ing.qty === null) ? null : cur.qty + ing.qty;
      }
      if (source){
        cur.fromPlan = true;
        if (cur.from.indexOf(source) < 0) cur.from.push(source);
      } else {
        cur.fromStaple = true;
      }
    }

    for (var day = 0; day < 7; day++){
      var ids = state.plansByDate[key(addDays(wk, day))] || [];
      for (var a = 0; a < ids.length; a++){
        var dish = findDish(ids[a]);
        if (!dish) continue;
        for (var b = 0; b < dish.ingredients.length; b++) push(dish.ingredients[b], dish.name);
      }
    }
    state.staples.forEach(function(s){ if (!s.deleted) push(s, null); });

    // 常備品のうち「切らした」ものを足す。
    // すでに同じ名前があれば単位が違ってもそこに合流させる（二重に出さないため）
    state.pantry.forEach(function(p){
      if (p.deleted || !p.out || !p.name || !p.name.trim()) return;
      var found = null;
      map.forEach(function(v){ if (!found && v.name === p.name) found = v; });
      if (!found){
        var k = itemKey(p.name, p.unit);
        found = map.get(k);
        if (!found){
          found = { key:k, name:p.name, unit:p.unit, qty:p.qty,
                    from:[], fromPlan:false, fromStaple:false };
          map.set(k, found);
        }
      }
      found.fromPantry = true;
      found.pantryIds = (found.pantryIds || []).concat([p.id]);
      // レシピ側が「適量」なら、常備品の分量（1本など）を採用して買う量を出す
      if (found.qty === null && typeof p.qty === 'number'){
        found.qty = p.qty;
        found.unit = p.unit;
      }
      if (found.from.length && found.from.indexOf('常備') < 0) found.from.push('常備');
    });

    var merged = Array.from(map.values());
    merged.forEach(function(x){
      if (x.fromPlan && x.fromStaple && x.from.indexOf('定番') < 0) x.from.push('定番');
      if (!x.fromPlan) x.kind = x.fromStaple ? '定番' : '常備';
    });

    var extraAll = (state.extras[wk] || []).map(function(e){
      return { key:'x:'+e.id, name:e.name, unit:'', qty:null, from:[], extraId:e.id, kind:'その他' };
    });

    function shown(x){ return !skipped[x.key]; }
    function hidden(x){ return !!skipped[x.key]; }

    return {
      // 献立に出てくるものは「献立の材料」側にまとめる（定番と二重に出さない）
      plan: merged.filter(function(x){ return x.fromPlan; }).filter(shown),
      staples: merged.filter(function(x){ return !x.fromPlan && x.fromStaple; }).filter(shown),
      // 買い物リストでも置き場所の順に並べる
      pantry: merged.filter(function(x){ return !x.fromPlan && !x.fromStaple && x.fromPantry; })
                    .filter(shown)
                    .sort(function(a, b){ return pcatIndex(a) - pcatIndex(b); }),
      extras: extraAll.filter(shown),
      // 今週だけ外したもの。買い物リストの一番下から戻せる。
      hidden: merged.concat(extraAll).filter(hidden)
    };
  }

  // 買い物リストの常備品を、置き場所の順に並べるための番号
  function pcatIndex(entry){
    var id = (entry.pantryIds || [])[0];
    var found = null;
    state.pantry.forEach(function(p){ if (!found && p.id === id) found = p; });
    var n = found ? PCATS.indexOf(found.cat) : -1;
    return n < 0 ? PCATS.length : n;
  }

  function findDish(id){
    for (var n = 0; n < state.dishes.length; n++) if (state.dishes[n].id === id) return state.dishes[n];
    return null;
  }

  // ================= 描画 =================
  function render(){
    document.getElementById('pane-plan').hidden = view.tab !== 'plan';
    document.getElementById('pane-shop').hidden = view.tab !== 'shop';
    document.getElementById('pane-dish').hidden = view.tab !== 'dish';
    document.getElementById('pane-pantry').hidden = view.tab !== 'pantry';
    document.getElementById('mainTabs').hidden = view.tab === 'pantry';
    document.getElementById('pantryBar').hidden = view.tab !== 'pantry';
    document.getElementById('addForm').hidden = view.tab !== 'shop';
    document.getElementById('toast').classList.toggle('high', view.tab !== 'shop');
    Array.prototype.forEach.call(document.querySelectorAll('#mainTabs button[data-tab]'), function(b){
      b.setAttribute('aria-selected', b.dataset.tab === view.tab ? 'true' : 'false');
    });
    renderWeekLabels();
    if (view.tab === 'plan') renderPlan();
    if (view.tab === 'shop') renderShop();
    if (view.tab === 'dish') renderDishes();
    if (view.tab === 'pantry') renderPantry();
  }

  function renderWeekLabels(){
    var s = fromKey(view.week), e = addDays(view.week, 6);

    document.getElementById('weekRange2').textContent = txt;
    document.getElementById('planSub').textContent = WD[startDay()] + '曜はじまりの1週間';
  }

  function renderPlan(){
    var host = document.getElementById('days');
    host.textContent = '';
    var todayKey = key(new Date());

      (function(n){

        if (dt.getDay() === 6) row.classList.add('sat');

        var lab = document.createElement('div');
        lab.className = 'daylabel';
        var wd = document.createElement('span'); wd.className = 'wd'; wd.textContent = WD[dt.getDay()];
        var dd = document.createElement('span'); dd.className = 'dt'; dd.textContent = md(dt);

        box.appendChild(add);

        row.appendChild(lab); row.appendChild(box);

      })(n);

  }

  function renderShop(){
    var host = document.getElementById('shopBody');
    host.textContent = '';
    var data = buildList();
    var checked = state.checked[view.week] || {};
    var all = data.plan.concat(data.staples, data.pantry, data.extras);
    var doneN = all.filter(function(x){ return checked[x.key]; }).length;

    document.getElementById('shopCount').textContent =
      all.length ? (all.length - doneN) + ' 品のこり' : '';

    if (!all.length && !data.hidden.length){
      var em = document.createElement('div');
      em.className = 'empty';
      em.innerHTML = '<span class="mark">○</span>まだ何もありません。<br>「こんだて」タブで料理を入れると、<br>材料がここに集まります。';
      host.appendChild(em);
      return;
    }

    section(host, '献立の材料', data.plan, checked);
    section(host, '毎週の定番', data.staples, checked);
    section(host, '切らした常備品', data.pantry, checked);
    section(host, 'その他', data.extras, checked);
    hiddenSection(host, data.hidden);
  }

  // 今週だけ外したものを、いつでも戻せるようにしておく
  function hiddenSection(host, items){
    if (!items.length) return;

    var h = document.createElement('h2');
    h.className = 'seclabel';
    var t = document.createElement('span'); t.textContent = '今週はずしたもの';
    var wrap = document.createElement('span');
    wrap.style.display = 'flex';
    wrap.style.alignItems = 'baseline';
    wrap.style.gap = '12px';
    var n = document.createElement('span'); n.className='n'; n.textContent = items.length + '品';
    var allBtn = document.createElement('button');
    allBtn.type='button'; allBtn.className='restoreall'; allBtn.textContent='全部もどす';
    allBtn.addEventListener('click', function(){
      snapshot();
      delete state.skipped[view.week];
      save(); render();
      toast(items.length + ' 品もどしました');
    });
    wrap.appendChild(n); wrap.appendChild(allBtn);
    h.appendChild(t); h.appendChild(wrap);
    host.appendChild(h);

    items.forEach(function(it){
      var row = document.createElement('div');
      row.className = 'row hiddenrow';

      var main = document.createElement('div');
      main.className = 'hiddenmain';
      var nm = document.createElement('span'); nm.className='rowname';
      var t1 = document.createElement('span'); t1.textContent = it.name;
      nm.appendChild(t1);
      // 手で足したものは分量を持たないので「適量」とは出さない
      if (!it.extraId){
        var t2 = document.createElement('span'); t2.className='qty';
        t2.textContent = fmtQty(it.qty, it.unit);
        nm.appendChild(t2);
      }
      main.appendChild(nm);
      if (it.from && it.from.length){
        var fr = document.createElement('span'); fr.className='rowfrom';
        fr.textContent = it.from.join('・');
        main.appendChild(fr);
      } else if (it.kind){
        var kd = document.createElement('span'); kd.className='rowfrom';
        kd.textContent = it.kind;
        main.appendChild(kd);
      }

      var back = document.createElement('button');
      back.type='button'; back.className='restore';
      back.textContent = 'もどす';
      back.setAttribute('aria-label', it.name + ' をリストに戻す');
      back.addEventListener('click', function(){ unskip(it.key, it.name); });

      row.appendChild(main); row.appendChild(back);
      host.appendChild(row);
    });
  }

  function unskip(k, name){
    if (state.skipped[view.week]) delete state.skipped[view.week][k];
    save(); render();
    toast('「' + name + '」を戻しました', true);
  }

  function section(host, title, items, checked){
    if (!items.length) return;
    var h = document.createElement('h2');
    h.className = 'seclabel';
    var t = document.createElement('span'); t.textContent = title;
    var n = document.createElement('span'); n.className='n'; n.textContent = items.length + '品';
    h.appendChild(t); h.appendChild(n);
    host.appendChild(h);

    items.forEach(function(it){
      var isDone = !!checked[it.key];
      var got = isDone ? 0 : boughtOf(it.key);
      var hasNum = (typeof it.qty === 'number');
      var partial = (!isDone && hasNum && got > 0);
      var u = it.unit || '';

      var row = document.createElement('div');
      row.className = 'row' + (isDone ? ' checked' : '') + (partial ? ' partial' : '');

      var tick = document.createElement('button');
      tick.type='button'; tick.className='rowtick';
      var box = document.createElement('span'); box.className='box';
      var main = document.createElement('span'); main.className='rowmain';
      var nm = document.createElement('span'); nm.className='rowname';
      var t1 = document.createElement('span'); t1.textContent = it.name;
      nm.appendChild(t1);
      main.appendChild(nm);

      var subs = [];
      if (it.from && it.from.length) subs.push(it.from.join('・'));
      if (partial) subs.push(fmtNum(it.qty) + u + '中 ' + fmtNum(got) + u + ' かごへ');
      if (subs.length){
        var fr = document.createElement('span'); fr.className='rowfrom';
        fr.textContent = subs.join(' ／ ');
        main.appendChild(fr);
      }
      tick.appendChild(box); tick.appendChild(main);
      tick.addEventListener('click', function(){ toggleCheck(it); });
      row.appendChild(tick);

      // 数量。数字があるものは押せるボタンにして、買った数を入れられるようにする
      if (!it.extraId){
        if (hasNum){
          var qb = document.createElement('button');
          qb.type='button'; qb.className='qtybtn';
          var qv = document.createElement('span');
          qv.textContent = partial ? ('のこり ' + fmtNum(it.qty - got) + u) : (fmtNum(it.qty) + u);
          var pm = document.createElement('span'); pm.className='pm'; pm.textContent = '±';
          qb.appendChild(qv); qb.appendChild(pm);
          qb.setAttribute('aria-label', it.name + ' の買った数を入力する');
          qb.addEventListener('click', function(){ openQty(it); });
          row.appendChild(qb);
        } else {
          var qs = document.createElement('span'); qs.className='qtyfree';
          qs.textContent = '適量';
          row.appendChild(qs);
        }
      }

      var x = document.createElement('button');
      x.type='button'; x.className='rowx'; x.textContent='✕';
      x.setAttribute('aria-label', it.name + ' を今週のリストから外す');
      x.addEventListener('click', function(){ skipItem(it); });

      row.appendChild(x);
      host.appendChild(row);
    });
  }

  // ---------- 買った数（部分的に買ったとき） ----------
  function boughtOf(k){
    var m = state.bought[view.week];
    return (m && typeof m[k] === 'number') ? m[k] : 0;
  }
  function fmtNum(n){ return String(Math.round(n * 100) / 100); }
  function stepOf(total){ return total >= 50 ? 10 : 1; }

  function openQty(it){
    qtyItem = it;
    renderQty();
    document.getElementById('qtySheet').hidden = false;
    document.getElementById('qtyBg').hidden = false;
  }
  function closeQty(){
    qtyItem = null;
    document.getElementById('qtySheet').hidden = true;
    document.getElementById('qtyBg').hidden = true;
  }
  function renderQty(){
    if (!qtyItem) return;
    var total = qtyItem.qty, u = qtyItem.unit || '';
    var done = !!(state.checked[view.week] || {})[qtyItem.key];
    var got = done ? total : boughtOf(qtyItem.key);
    var step = stepOf(total);

    document.getElementById('qtyTitle').textContent = qtyItem.name;
    document.getElementById('qtyTotal').textContent = 'ぜんぶで ' + fmtNum(total) + u;
    document.getElementById('qtyInput').value = fmtNum(got);
    document.getElementById('qtyMinus').textContent = step > 1 ? ('− ' + step) : '−';
    document.getElementById('qtyPlus').textContent  = step > 1 ? ('＋ ' + step) : '＋';

    var rest = Math.max(0, total - got);
    document.getElementById('qtyRest').textContent =
      rest > 0 ? ('のこり ' + fmtNum(rest) + u) : 'ぜんぶ買いました';
  }
  function applyQty(n){
    if (!qtyItem) return;
    var total = qtyItem.qty, k = qtyItem.key;
    if (isNaN(n) || n < 0) n = 0;
    if (n > total) n = total;

    if (!state.bought[view.week]) state.bought[view.week] = {};
    if (!state.checked[view.week]) state.checked[view.week] = {};

    if (n >= total){
      state.checked[view.week][k] = true;
      delete state.bought[view.week][k];
      setPantryOut(qtyItem, false);
    } else if (n <= 0){
      delete state.checked[view.week][k];
      delete state.bought[view.week][k];
      setPantryOut(qtyItem, true);
    } else {
      delete state.checked[view.week][k];
      state.bought[view.week][k] = n;
    }
    save(); render(); renderQty();
  }
  function currentQty(){
    return parseFloat(document.getElementById('qtyInput').value);
  }

  function countByCat(cat){
    return state.dishes.filter(function(x){ return x.cat === cat; }).length;
  }

  function renderDishes(){
    // しぼりこみボタン（レシピが1つも無い分類は出さない）
    var fhost = document.getElementById('dishFilters');
    fhost.textContent = '';
    var options = [{ key:'all', label:'すべて', n: state.dishes.length }];
    CATS.forEach(function(c){
      var n = countByCat(c);
      if (n) options.push({ key:c, label:c, n:n });
    });
    if (options.length > 1 && CATS.indexOf(view.dishFilter) >= 0 && !countByCat(view.dishFilter)){
      view.dishFilter = 'all';   // 中身が無くなった分類が選ばれたままにならないように
    }
    options.forEach(function(o){
      var b = document.createElement('button');
      b.type='button';
      var lb = document.createElement('span'); lb.textContent = o.label;
      var nb = document.createElement('span'); nb.className='fn'; nb.textContent = o.n;
      b.appendChild(lb); b.appendChild(nb);
      b.setAttribute('aria-label', o.label + ' ' + o.n + '品');
      b.setAttribute('aria-pressed', view.dishFilter === o.key ? 'true' : 'false');
      b.addEventListener('click', function(){ view.dishFilter = o.key; render(); });
      fhost.appendChild(b);
    });

    var host = document.getElementById('dishList');
    host.textContent = '';

    var showing = view.dishFilter === 'all'
      ? state.dishes
      : state.dishes.filter(function(x){ return x.cat === view.dishFilter; });

    if (!showing.length){
      var em = document.createElement('div');
      em.className = 'empty';
      em.innerHTML = '<span class="mark">○</span>レシピがありません。<br>下の「＋ レシピを追加」から登録できます。';
      host.appendChild(em);
    }

    // 「すべて」のときは分類ごとに見出しを付けてまとめる
    if (view.dishFilter === 'all'){
      CATS.forEach(function(cat){
        var group = state.dishes.filter(function(x){ return x.cat === cat; });
        if (!group.length) return;
        var h = document.createElement('h2');
        h.className = 'seclabel';
        var t = document.createElement('span'); t.textContent = cat;
        var n = document.createElement('span'); n.className='n'; n.textContent = group.length + '品';
        h.appendChild(t); h.appendChild(n);
        host.appendChild(h);
        group.forEach(function(dish){ appendDishRow(host, dish, false); });
      });
    } else {
      showing.forEach(function(dish){ appendDishRow(host, dish, false); });
    }

    renderStaples();
  }

  function appendDishRow(host, dish, showTag){
    var row = document.createElement('div');
    row.className = 'dishrow';
    var open = document.createElement('button');
    open.type='button'; open.className='open';
    var nm = document.createElement('span'); nm.textContent = dish.name;
    if (showTag){
      var tg = document.createElement('span'); tg.className='catbadge'; tg.textContent = dish.cat;
      nm.appendChild(tg);
    }
    var cnt = document.createElement('span'); cnt.className='cnt';
    cnt.textContent = '材料 ' + dish.ingredients.length + (view.openDish === dish.id ? ' ▲' : ' ▼');
    open.appendChild(nm); open.appendChild(cnt);
    open.addEventListener('click', function(){
      view.openDish = (view.openDish === dish.id) ? null : dish.id;
      render();
    });
    row.appendChild(open);
    host.appendChild(row);
    if (view.openDish === dish.id) host.appendChild(editor(dish));
  }

  function renderStaples(){
    var sbox = document.getElementById('stapleBox');
    sbox.textContent = '';
    var wrap = document.createElement('div');
    wrap.className = 'editor';
    var head = document.createElement('div');
    head.className = 'inghead';
    ['品名','数量','単位',''].forEach(function(t){ var s=document.createElement('span'); s.textContent=t; head.appendChild(s); });
    wrap.appendChild(head);
    // 消しても配列からは取り除かず、印だけ付ける（下の「消した定番」から戻せる）
    state.staples.filter(function(s){ return !s.deleted; }).forEach(function(s){
      wrap.appendChild(ingRow(s, function(){
        snapshot();
        s.deleted = true;
        save(); render(); toast('「' + (s.name || 'この行') + '」を定番から外しました');
      }));
    });
    var addS = document.createElement('button');
    addS.type='button'; addS.className='ghost'; addS.textContent='＋ 定番を追加';
    addS.addEventListener('click', function(){
      state.staples.push(i('', 1, '個')); save(); render();
    });
    wrap.appendChild(addS);
    sbox.appendChild(wrap);

    restoreBox(sbox, state.staples.filter(function(s){ return s.deleted; }), '消した定番');
  }

  // ================= 常備品 =================
  function pantryCount(cat){
    return state.pantry.filter(function(p){ return !p.deleted && p.cat === cat; }).length;
  }

  function renderPantry(){
    var live = state.pantry.filter(function(p){ return !p.deleted; });
    var outN = live.filter(function(p){ return p.out; }).length;

    var tools = document.getElementById('pantryTools');
    tools.textContent = '';
    var info = document.createElement('span');
    info.className = 'pantryinfo' + (outN ? ' warn' : '');
    info.textContent = outN ? ('切らしているもの ' + outN + '品') : 'ぜんぶそろっています';
    tools.appendChild(info);
    var eb = document.createElement('button');
    eb.type='button'; eb.className='ghost';
    eb.textContent = view.pantryEdit ? '完了' : '編集';
    eb.addEventListener('click', function(){ view.pantryEdit = !view.pantryEdit; render(); });
    tools.appendChild(eb);

    // 分類のしぼりこみ（中身が無い分類は出さない）
    var fhost = document.getElementById('pantryFilters');
    fhost.textContent = '';
    if (PCATS.indexOf(view.pantryFilter) >= 0 && !pantryCount(view.pantryFilter)){
      view.pantryFilter = 'all';
    }
    var opts = [{ key:'all', label:'すべて', n: live.length }];
    PCATS.forEach(function(c){
      var n = pantryCount(c);
      if (n) opts.push({ key:c, label:c, n:n });
    });
    opts.forEach(function(o){
      var b = document.createElement('button');
      b.type='button';
      var lb = document.createElement('span'); lb.textContent = o.label;
      var nb = document.createElement('span'); nb.className='fn'; nb.textContent = o.n;
      b.appendChild(lb); b.appendChild(nb);
      b.setAttribute('aria-label', o.label + ' ' + o.n + '品');
      b.setAttribute('aria-pressed', view.pantryFilter === o.key ? 'true' : 'false');
      b.addEventListener('click', function(){ view.pantryFilter = o.key; render(); });
      fhost.appendChild(b);
    });

    var showing = (view.pantryFilter === 'all')
      ? live
      : live.filter(function(p){ return p.cat === view.pantryFilter; });

    var host = document.getElementById('pantryList');
    host.textContent = '';

    if (view.pantryEdit){
      var wrap = document.createElement('div');
      wrap.className = 'editor';
      showing.forEach(function(p){ wrap.appendChild(pantryEditRow(p)); });
      var add = document.createElement('button');
      add.type='button'; add.className='ghost'; add.textContent='＋ 常備品を追加';
      add.addEventListener('click', function(){
        var cat = (view.pantryFilter !== 'all') ? view.pantryFilter : '調味料';
        state.pantry.push(pt('', 1, '本', cat)); save(); render();
      });
      wrap.appendChild(add);
      host.appendChild(wrap);

      restoreBox(host, state.pantry.filter(function(p){ return p.deleted; }), '消した常備品');
      return;
    }

    if (!showing.length){
      var em = document.createElement('div');
      em.className = 'empty';
      em.innerHTML = '<span class="mark">○</span>この分類には何もありません。<br>「編集」から追加できます。';
      host.appendChild(em);
      return;
    }

    // 「すべて」のときは置き場所ごとに見出しを付ける
    if (view.pantryFilter === 'all'){
      PCATS.forEach(function(cat){
        var group = live.filter(function(p){ return p.cat === cat; });
        if (!group.length) return;
        var h = document.createElement('h2');
        h.className = 'seclabel';
        var t = document.createElement('span'); t.textContent = cat;
        var outn = group.filter(function(p){ return p.out; }).length;
        var n = document.createElement('span'); n.className='n';
        n.textContent = outn ? (outn + '品 切らした') : (group.length + '品');
        h.appendChild(t); h.appendChild(n);
        host.appendChild(h);
        group.forEach(function(p){ pantryRow(host, p); });
      });
      return;
    }
    showing.forEach(function(p){ pantryRow(host, p); });
  }

  // 編集モードの1行：名前＋✕／分類・数量・単位
  function pantryEditRow(p){
    var box = document.createElement('div');
    box.className = 'pedit';

    var r1 = document.createElement('div'); r1.className = 'r1';
    var n = document.createElement('input');
    n.type='text'; n.value = p.name; n.placeholder='品名'; n.setAttribute('aria-label','品名');
    n.addEventListener('input', function(){ p.name = n.value; save(); });
    var del = document.createElement('button');
    del.type='button'; del.className='del'; del.textContent='✕';
    del.setAttribute('aria-label','この行を消す');
    del.addEventListener('click', function(){
      snapshot(); p.deleted = true; save(); render();
      toast('「' + (p.name || 'この行') + '」を常備品から外しました');
    });
    r1.appendChild(n); r1.appendChild(del);

    var r2 = document.createElement('div'); r2.className = 'r2';
    var sel = document.createElement('select');
    sel.setAttribute('aria-label','置き場所');
    PCATS.forEach(function(c){
      var o = document.createElement('option');
      o.value = c; o.textContent = c;
      if (p.cat === c) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function(){ p.cat = sel.value; save(); render(); });

    var q = document.createElement('input');
    q.type='number'; q.step='any'; q.min='0';
    q.value = (p.qty === null || p.qty === undefined) ? '' : p.qty;
    q.placeholder='適量'; q.setAttribute('aria-label','数量');
    q.addEventListener('input', function(){
      p.qty = q.value === '' ? null : parseFloat(q.value);
      if (isNaN(p.qty)) p.qty = null;
      save();
    });

    var u = document.createElement('input');
    u.type='text'; u.value = p.unit || ''; u.placeholder='－'; u.setAttribute('aria-label','単位');
    u.addEventListener('input', function(){ p.unit = u.value; save(); });

    r2.appendChild(sel); r2.appendChild(q); r2.appendChild(u);
    box.appendChild(r1); box.appendChild(r2);
    return box;
  }

  function pantryRow(host, p){
    (function(){
      var row = document.createElement('div');
      row.className = 'row pantryrow' + (p.out ? ' isout' : '');
      var btn = document.createElement('button');
      btn.type='button'; btn.className='rowtick';
      btn.setAttribute('aria-pressed', p.out ? 'true' : 'false');

      var main = document.createElement('span'); main.className='rowmain';
      var nm = document.createElement('span'); nm.className='rowname';
      var t1 = document.createElement('span'); t1.textContent = p.name || '(名前なし)';
      nm.appendChild(t1);
      main.appendChild(nm);
      if (p.out){
        var fr = document.createElement('span'); fr.className='rowfrom';
        fr.textContent = '買い物リストに出ています（' + fmtQty(p.qty, p.unit) + '）';
        main.appendChild(fr);
      }
      btn.appendChild(main);

      var pill = document.createElement('span');
      pill.className = 'statepill';
      pill.textContent = p.out ? '切らした' : 'ある';
      btn.appendChild(pill);

      btn.addEventListener('click', function(){
        p.out = !p.out;
        save(); render();
      });
      row.appendChild(btn);
      host.appendChild(row);
    })();
  }

  // 「消した◯◯」の復元欄（定番と常備品で共用）
  function restoreBox(host, gone, title){
    if (!gone.length) return;
    var h = document.createElement('h2');
    h.className = 'seclabel';
    var t = document.createElement('span'); t.textContent = title;
    var right = document.createElement('span');
    right.style.display='flex'; right.style.alignItems='baseline'; right.style.gap='12px';
    var n = document.createElement('span'); n.className='n'; n.textContent = gone.length + '品';
    var allBtn = document.createElement('button');
    allBtn.type='button'; allBtn.className='restoreall'; allBtn.textContent='全部もどす';
    allBtn.addEventListener('click', function(){
      snapshot();
      gone.forEach(function(s){ delete s.deleted; });
      save(); render(); toast(gone.length + ' 品もどしました');
    });
    right.appendChild(n); right.appendChild(allBtn);
    h.appendChild(t); h.appendChild(right);
    host.appendChild(h);

    gone.forEach(function(s){
      var row = document.createElement('div');
      row.className = 'row hiddenrow';
      var main = document.createElement('div'); main.className='hiddenmain';
      var nm = document.createElement('span'); nm.className='rowname';
      var t1 = document.createElement('span'); t1.textContent = s.name || '(名前なし)';
      var t2 = document.createElement('span'); t2.className='qty'; t2.textContent = fmtQty(s.qty, s.unit);
      nm.appendChild(t1); nm.appendChild(t2);
      main.appendChild(nm);
      var back = document.createElement('button');
      back.type='button'; back.className='restore'; back.textContent='もどす';
      back.setAttribute('aria-label', (s.name || 'この行') + ' をもどす');
      back.addEventListener('click', function(){
        delete s.deleted; save(); render();
        toast('「' + (s.name || 'この行') + '」をもどしました', true);
      });
      row.appendChild(main); row.appendChild(back);
      host.appendChild(row);
    });
  }

  function editor(dish){
    var wrap = document.createElement('div');
    wrap.className = 'editor';

    var nameF = document.createElement('input');
    nameF.className='namefield'; nameF.type='text'; nameF.value = dish.name;
    nameF.setAttribute('aria-label','料理名');
    nameF.addEventListener('input', function(){ dish.name = nameF.value; save(); });
    wrap.appendChild(nameF);

    // 分類えらび
    var clab = document.createElement('div');
    clab.className = 'inghead';
    var cs = document.createElement('span'); cs.textContent = '分類';
    clab.appendChild(cs);
    wrap.appendChild(clab);

    var cwrap = document.createElement('div');
    cwrap.id = 'catPickWrap';
    CATS.forEach(function(cat){
      var b = document.createElement('button');
      b.type='button'; b.textContent = cat;
      b.setAttribute('aria-pressed', dish.cat === cat ? 'true' : 'false');
      b.addEventListener('click', function(){
        dish.cat = cat;
        if (view.dishFilter !== 'all' && view.dishFilter !== cat) view.dishFilter = cat;
        save(); render();
      });
      cwrap.appendChild(b);
    });
    wrap.appendChild(cwrap);

    var head = document.createElement('div');
    head.className='inghead';
    ['材料','数量','単位',''].forEach(function(t){ var s=document.createElement('span'); s.textContent=t; head.appendChild(s); });
    wrap.appendChild(head);

    dish.ingredients.forEach(function(ing, idx){
      wrap.appendChild(ingRow(ing, function(){
        snapshot();
        dish.ingredients.splice(idx,1);
        save(); render(); toast('材料を消しました');
      }));
    });

    var bar = document.createElement('div'); bar.className='editrow';
    var addI = document.createElement('button');
    addI.type='button'; addI.className='ghost'; addI.textContent='＋ 材料を追加';
    addI.addEventListener('click', function(){
      dish.ingredients.push(i('', 1, '個')); save(); render();
    });
    var delD = document.createElement('button');
    delD.type='button'; delD.className='ghost danger'; delD.textContent='このレシピを消す';
    delD.addEventListener('click', function(){
      snapshot();
      state.dishes = state.dishes.filter(function(x){ return x.id !== dish.id; });
      view.openDish = null;
      save(); render(); toast('「' + dish.name + '」を消しました');
    });
    bar.appendChild(addI); bar.appendChild(delD);
    wrap.appendChild(bar);
    return wrap;
  }

  function ingRow(ing, onDelete){
    var row = document.createElement('div');
    row.className = 'ingrow';

    var n = document.createElement('input');
    n.type='text'; n.value = ing.name; n.placeholder='材料名'; n.setAttribute('aria-label','材料名');
    n.addEventListener('input', function(){ ing.name = n.value; save(); });

    var q = document.createElement('input');
    q.type='number'; q.step='any'; q.min='0';
    q.value = (ing.qty === null || ing.qty === undefined) ? '' : ing.qty;
    q.placeholder='適量'; q.setAttribute('aria-label','数量');
    q.addEventListener('input', function(){
      ing.qty = q.value === '' ? null : parseFloat(q.value);
      if (isNaN(ing.qty)) ing.qty = null;
      save();
    });

    var u = document.createElement('input');
    u.type='text'; u.value = ing.unit || ''; u.placeholder='－'; u.setAttribute('aria-label','単位');
    u.addEventListener('input', function(){ ing.unit = u.value; save(); });

    var del = document.createElement('button');
    del.type='button'; del.className='del'; del.textContent='✕';
    del.setAttribute('aria-label','この行を消す');
    del.addEventListener('click', onDelete);

    row.appendChild(n); row.appendChild(q); row.appendChild(u); row.appendChild(del);
    return row;
  }

  // ================= 操作 =================
  // 分類を選ぶ → その分類のレシピが出る、の2段階
  function openSheet(dayIndex){
    pickTarget = key(addDays(view.week, dayIndex));
    pickDate = addDays(view.week, dayIndex);
    pickCat = null;
    renderSheet();
    document.getElementById('sheet').hidden = false;
    document.getElementById('sheetBg').hidden = false;
  }

  function renderSheet(){
    var list = document.getElementById('sheetList');
    var back = document.getElementById('sheetBack');
    var title = document.getElementById('sheetTitle');
    var dayTitle = md(pickDate) + '(' + WD[pickDate.getDay()] + ') につくる料理';
    list.textContent = '';

    if (!state.dishes.length){
      back.hidden = true;
      title.textContent = dayTitle;
      var p = document.createElement('div');
      p.className = 'empty';
      p.textContent = 'レシピがまだありません。「レシピ」タブで登録してください。';
      list.appendChild(p);
      return;
    }

    if (pickCat === null){
      back.hidden = true;
      title.textContent = dayTitle;
      sheetRow(list, 'すべて', state.dishes.length + '品', false, function(){
        pickCat = 'all'; renderSheet();
      });
      CATS.forEach(function(cat){
        var n = countByCat(cat);
        if (!n) return;
        sheetRow(list, cat, n + '品', false, function(){ pickCat = cat; renderSheet(); });
      });
      return;
    }

    back.hidden = false;
    title.textContent = (pickCat === 'all') ? 'すべてのレシピ' : pickCat;
    var arr = (pickCat === 'all')
      ? state.dishes
      : state.dishes.filter(function(x){ return x.cat === pickCat; });
    arr.forEach(function(dish){
      sheetRow(list, dish.name, (pickCat === 'all') ? dish.cat : '', true, function(){
        addToDay(pickTarget, dish.id);
        closeSheet();
      });
    });
  }

  function sheetRow(host, label, right, rightIsTag, onClick){
    var b = document.createElement('button');
    b.type = 'button';
    var row = document.createElement('span'); row.className = 'srow';
    var l = document.createElement('span'); l.textContent = label;
    row.appendChild(l);
    if (right){
      var r = document.createElement('span');
      r.className = rightIsTag ? 'tag' : 'n';
      r.textContent = right;
      row.appendChild(r);
    }
    b.appendChild(row);
    b.addEventListener('click', onClick);
    host.appendChild(b);
  }
  function closeSheet(){
    document.getElementById('sheet').hidden = true;
    document.getElementById('sheetBg').hidden = true;
  }

  // ---------- 設定 ----------
  function openSettings(){
    renderSettings();
    document.getElementById('setSheet').hidden = false;
    document.getElementById('setBg').hidden = false;
  }
  function closeSettings(){
    document.getElementById('setSheet').hidden = true;
    document.getElementById('setBg').hidden = true;
  }
  function renderSettings(){
    var sd = startDay();
    var e = addDays(weekStartOf(new Date()), 6);
    document.getElementById('setHelp').textContent =
      'いまは ' + WD[sd] + '曜 から ' + WD[e.getDay()] + '曜 までの7日間です';

    var host = document.getElementById('wdPick');
    host.textContent = '';
    for (var n = 0; n < 7; n++){
      (function(n){
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = WD[n];
        b.setAttribute('aria-pressed', n === sd ? 'true' : 'false');
        b.setAttribute('aria-label', WD[n] + '曜はじまりにする');
        b.addEventListener('click', function(){ setWeekStart(n); });
        host.appendChild(b);
      })(n);
    }
  }
  function setWeekStart(dayNum){
    if (dayNum === startDay()) return;
    state.settings.weekStartDay = dayNum;
    view.week = weekStartOf(new Date());   // 区切りが変わるので今週に戻す
    save();
    renderSettings();
    render();
    toast(WD[dayNum] + '曜はじまりにしました', true);
  }

  function addToDay(dateKey, dishId){
    if (!state.plansByDate[dateKey]) state.plansByDate[dateKey] = [];
    state.plansByDate[dateKey].push(dishId);
    save(); render();
  }
  function removeFromDay(dateKey, idx){
    var arr = state.plansByDate[dateKey];
    if (!arr) return;
    arr.splice(idx,1);
    if (!arr.length) delete state.plansByDate[dateKey];
    save(); render();
  }

  function toggleCheck(it){
    var k = it.key;
    if (!state.checked[view.week]) state.checked[view.week] = {};
    var c = state.checked[view.week];
    var nowChecked = !c[k];
    if (nowChecked) c[k] = true; else delete c[k];
    // 全部買った／未着手にするので、途中まで買った記録は消す
    if (state.bought[view.week]) delete state.bought[view.week][k];
    setPantryOut(it, !nowChecked);
    save(); render();
  }

  // 買ったら常備品の印を「ある」に戻す（買ったのに翌週も残るのを防ぐ）
  function setPantryOut(it, out){
    if (!it || !it.pantryIds || !it.pantryIds.length) return;
    it.pantryIds.forEach(function(id){
      state.pantry.forEach(function(p){ if (p.id === id) p.out = out; });
    });
  }

  // 消すのではなく「今週だけ外す」。一番下の「今週はずしたもの」から戻せる。
  function skipItem(it){
    snapshot();
    if (!state.skipped[view.week]) state.skipped[view.week] = {};
    state.skipped[view.week][it.key] = true;
    save(); render();
    toast('「' + it.name + '」を外しました（下から戻せます）');
  }

  function clearWeek(){
    var keys = [], any = false;
    for (var n = 0; n < 7; n++){
      var dk = key(addDays(view.week, n));
      keys.push(dk);
      if (state.plansByDate[dk] && state.plansByDate[dk].length) any = true;
    }
    if (!any){ toast('この週の献立はまだ空です', true); return; }
    snapshot();
    keys.forEach(function(dk){ delete state.plansByDate[dk]; });
    delete state.skipped[view.week];
    save(); render();
    toast('この週の献立を空にしました');
  }
  function uncheckAll(){
    snapshot();
    delete state.checked[view.week];
    delete state.bought[view.week];
    save(); render();
    toast('チェックをはずしました');
  }

  // ---------- トースト ----------
  function toast(msg, noUndo){
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('undoBtn').hidden = !!noUndo;
    document.getElementById('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast(){ document.getElementById('toast').hidden = true; }

  // ---------- バックアップ ----------
  async function exportJSON(){
    var stamp = key(new Date());
    var filename = 'kondate-' + stamp + '.json';
    var text = JSON.stringify(state, null, 2);
    var dl = null;
    try{
      if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads');
    }catch(e){ dl = null; }
    if (dl){
      try{ await dl.save({ filename: filename, data: text }); toast('書き出しました', true); }
      catch(err){ if (!err || err.code !== 'declined') toast('書き出せませんでした', true); }
      return;
    }
    var blob = new Blob([text], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
    toast('書き出しました', true);
  }
  function importJSON(file){
    var r = new FileReader();
    r.onload = function(){
      try{
        var data = JSON.parse(r.result);
        if (!data || !Array.isArray(data.dishes)) throw new Error('bad');
        snapshot();
        state = data;
        state.plans = state.plans||{}; state.extras = state.extras||{};
        state.checked = state.checked||{}; state.skipped = state.skipped||{};
        state.staples = state.staples||[];
        save(); render(); toast('読み込みました');
      }catch(e){
        toast('読み込めませんでした。書き出したJSONを選んでください', true);
      }
    };
    r.onerror = function(){ toast('ファイルを開けませんでした', true); };
    r.readAsText(file);
  }

  // ================= イベント =================
  Array.prototype.forEach.call(document.querySelectorAll('#mainTabs button[data-tab]'), function(b){
    b.addEventListener('click', function(){ view.tab = b.dataset.tab; render(); });
  });
  document.getElementById('toPantry').addEventListener('click', function(){
    view.prevTab = view.tab;
    view.tab = 'pantry';
    render();
  });
  document.getElementById('fromPantry').addEventListener('click', function(){
    view.pantryEdit = false;
    view.tab = view.prevTab || 'shop';
    render();
  });
  function shiftWeek(n){
    view.week = key(addDays(view.week, n*7));
    render();
  }
  document.getElementById('prevWeek').addEventListener('click', function(){ shiftWeek(-1); });
  document.getElementById('nextWeek').addEventListener('click', function(){ shiftWeek(1); });
  document.getElementById('prevWeek2').addEventListener('click', function(){ shiftWeek(-1); });
  document.getElementById('nextWeek2').addEventListener('click', function(){ shiftWeek(1); });

  document.getElementById('sheetBack').addEventListener('click', function(){
    pickCat = null; renderSheet();
  });
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  document.getElementById('sheetBg').addEventListener('click', closeSheet);
  document.getElementById('setClose').addEventListener('click', closeSettings);
  document.getElementById('setBg').addEventListener('click', closeSettings);

  document.getElementById('qtyClose').addEventListener('click', closeQty);
  document.getElementById('qtyBg').addEventListener('click', closeQty);
  document.getElementById('qtyMinus').addEventListener('click', function(){
    applyQty(currentQty() - stepOf(qtyItem.qty));
  });
  document.getElementById('qtyPlus').addEventListener('click', function(){
    applyQty(currentQty() + stepOf(qtyItem.qty));
  });
  document.getElementById('qtyInput').addEventListener('change', function(){
    applyQty(currentQty());
  });
  document.getElementById('qtyAll').addEventListener('click', function(){
    applyQty(qtyItem.qty); closeQty();
  });
  document.getElementById('qtyZero').addEventListener('click', function(){ applyQty(0); });

  document.getElementById('addDish').addEventListener('click', function(){
    var cat = (view.dishFilter !== 'all') ? view.dishFilter : 'その他';
    var nd = d('新しい料理', cat, [i('', 1, '個')]);
    state.dishes.push(nd);
    view.openDish = nd.id;
    save(); render();
    var el = document.getElementById('catPickWrap');
    if (el && el.scrollIntoView) el.scrollIntoView({ block:'center' });
  });

  document.getElementById('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var inp = document.getElementById('extraInput');
    var v = inp.value.trim();
    if (!v) return;
    if (!state.extras[view.week]) state.extras[view.week] = [];
    state.extras[view.week].push({ id: uid(), name: v });
    inp.value = ''; inp.focus();
    save(); render();
  });

  var menu = document.getElementById('menu'), scrim = document.getElementById('scrim'),
      menuBtn = document.getElementById('menuBtn');
  function setMenu(open){
    menu.hidden = !open; scrim.hidden = !open;
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  menuBtn.addEventListener('click', function(){ setMenu(menu.hidden); });
  scrim.addEventListener('click', function(){ setMenu(false); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ setMenu(false); closeSheet(); closeSettings(); closeQty(); }
  });
  menu.addEventListener('click', function(e){
    var act = e.target && e.target.dataset ? e.target.dataset.act : null;
    if (!act) return;
    setMenu(false);
    if (act === 'settings') openSettings();
    if (act === 'clearWeek') clearWeek();
    if (act === 'uncheckAll') uncheckAll();
    if (act === 'export') exportJSON();
    if (act === 'import') document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change', function(e){
    if (e.target.files && e.target.files[0]) importJSON(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('undoBtn').addEventListener('click', undo);

  render();
})();
</script>

</html>
